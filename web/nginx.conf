server {
    listen 8765;
    root /usr/share/nginx/html;
    gzip_static on;

    location = /v1 {
        try_files /v1/index.html =404;
    }

    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
